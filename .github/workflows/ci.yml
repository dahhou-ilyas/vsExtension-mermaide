name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package

      - name: Integration tests
        run: xvfb-run -a npx vscode-test

      - name: Package VSIX
        run: npx vsce package --no-dependencies --out flowchart-generator.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: flowchart-generator-vsix
          path: flowchart-generator.vsix
